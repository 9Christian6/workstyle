# Config for workstyle
#
# Format:
# "pattern" = "icon"
#
# Patterns match foreground programs, app_id or WM_CLASS, never window titles.
# The icon will be used to represent that application.
#
# Foreground program matches precede terminal matches. Within each group,
# the first matching pattern in this file wins. Matching ignores case.
# Add scoped title exceptions with [[overrides]] below.

"alacritty" = ""
"firefox" = ""
"chrome" = ""
"brave" = ""
"file manager" = ""
"libreoffice calc" = ""
"libreoffice writer" = ""
"libreoffice" = ""
"nvim" = ""
"gthumb" = ""
"menu" = ""
"calculator" = ""
"transmission" = ""
"videostream" = ""
"mpv" = ""
"music" = ""
"disk usage" = ""

# Exceptions run before program mappings; the first matching exception wins.
[[overrides]]
app = "brave"
title = "YouTube"
icon = ""

[[overrides]]
app = "brave"
title = "Twitch"
icon = ""

[other]
fallback_icon = "🤨"
deduplicate_icons = false
separator = ": "
